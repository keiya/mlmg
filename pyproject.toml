[project]
name = "mangaka"
version = "0.1.0"
description = "Short manga generator with multi-layered prompts + gpt-image-2"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "openai>=2.0",
    "returns>=0.23",
    "pydantic>=2.0",
    "python-frontmatter>=1.1",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "rich>=13.0",
    "reportlab>=4.0",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.15",
    "pyright>=1.1",
    "pikepdf>=9.0",
    "hypothesis>=6.0",
]

[project.scripts]
mangaka = "mangaka.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "C90"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
  "smoke: quick import / CLI sanity checks (run on every Stop hook)",
  "integration: real OpenAI API calls (RUN_INTEGRATION=1 pytest -m integration)",
]
filterwarnings = [
    "error::Warning:mangaka",
    "default::DeprecationWarning",
]
